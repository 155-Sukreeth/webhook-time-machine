# https://taskfile.dev

version: '3'

vars:
  BINARY_NAME: wtm
  BUILD_DIR: bin
  CMD_PATH: ./cmd/wtm

tasks:
  default:
    cmds:
      - task: build

  build:
    desc: Build the wtm binary executable
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - go build -o {{.BUILD_DIR}}/{{.BINARY_NAME}} {{.CMD_PATH}}

  run:
    desc: Build and run wtm start
    deps: [build]
    cmds:
      - ./{{.BUILD_DIR}}/{{.BINARY_NAME}} start

  init:
    desc: Initialize default .wtm.yaml configuration file
    deps: [build]
    cmds:
      - ./{{.BUILD_DIR}}/{{.BINARY_NAME}} init

  test:
    desc: Run unit & integration tests with coverage
    cmds:
      - go test -v -coverprofile coverage.out ./...

  lint:
    desc: Run golangci-lint quality checks via go tool
    cmds:
      - go tool golangci-lint run ./...

  sec:
    desc: Run gosec security AST scanner via go tool
    cmds:
      - go tool gosec ./...

  vulndb:
    desc: Run govulncheck dependency vulnerability scanner via go tool
    cmds:
      - go tool govulncheck ./...

  ci:
    desc: Run full CI suite stops on first failure
    cmds:
      - task: lint
      - task: sec
      - task: vulndb
      - task: test

  clean:
    desc: Remove build directory, test coverage outputs, and local database files
    cmds:
      - rm -rf {{.BUILD_DIR}} coverage.out wtm.db
